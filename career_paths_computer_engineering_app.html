            if (!('speechSynthesis' in window)) {
                alert('Trình duyệt của bạn không hỗ trợ tính năng đọc phát âm (Web Speech API).');
                return;
            }
            window.speechSynthesis.cancel(); // Stop current speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = rate;
            
            // Pick an English voice if available
            const voices = window.speechSynthesis.getVoices();
            const enVoice = voices.find(v => v.lang.includes('en-US') || v.lang.includes('en-GB'));

        function FlashcardsModule({ vocabulary, learnedIds, toggleLearned }) {
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [isFlipped, setIsFlipped] = React.useState(false);
            const [autoSpeech, setAutoSpeech] = React.useState(true);

            // Reset index if list changes
            React.useEffect(() => {
                setCurrentIndex(0);
                setIsFlipped(false);
            }, [vocabulary.length]);

            if (!vocabulary || vocabulary.length === 0) {
                return (
                    <div className="glass-panel rounded-2xl p-12 text-center text-slate-400 space-y-3">
                        <i className="fa-solid fa-folder-open text-4xl text-slate-600"></i>
                        <p className="text-base font-medium">Không tìm thấy từ vựng tương ứng với bộ lọc này.</p>
                        <p className="text-xs text-slate-500">Vui lòng chuyển đổi chọn Book hoặc Unit ở bảng điều khiển bên trái.</p>
                    </div>
                );
            }

            const currentCard = vocabulary[currentIndex] || vocabulary[0];
            const isLearned = learnedIds.includes(currentCard.id);

            const handleNext = () => {
                setIsFlipped(false);
                setCurrentIndex((prev) => (prev + 1) % vocabulary.length);
            };

            const handlePrev = () => {
                setIsFlipped(false);
                setCurrentIndex((prev) => (prev - 1 + vocabulary.length) % vocabulary.length);
            };

            const handleShuffle = () => {
                setIsFlipped(false);
                const randomIndex = Math.floor(Math.random() * vocabulary.length);
                setCurrentIndex(randomIndex);
            };

            // Keyboard navigation
            React.useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === ' ') {
                        e.preventDefault();
                        setIsFlipped(f => !f);
                    } else if (e.key === 'ArrowRight') {
                        handleNext();
                    } else if (e.key === 'ArrowLeft') {
                        handlePrev();
                    } else if (e.key === 'm' || e.key === 'M') {
                        toggleLearned(currentCard.id);
                    } else if (e.key === 's' || e.key === 'S') {
                        speakEnglish(currentCard.term);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [currentCard, vocabulary.length]);

            return (
                <div className="space-y-6">
                    {/* Top Control Header */}
                    <div className="flex flex-wrap items-center justify-between gap-3 text-xs bg-slate-900/60 p-3 rounded-xl border border-slate-800">

                            <span className="font-bold text-cyan-400 text-sm">Thẻ {currentIndex + 1} / {vocabulary.length}</span>
                            <span>•</span>
                            <span className="bg-slate-800 px-2 py-0.5 rounded text-slate-300">
                                Book {currentCard.book} - Unit {currentCard.unit}

                        </div>

                            >
                                <i className={`fa-solid ${autoSpeech ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i>
                                <span>Tự động đọc: {autoSpeech ? 'BẬT' : 'TẮT'}</span>
                            </button>

                            <button
                                onClick={handleShuffle}
                                className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all flex items-center gap-1"
                                title="Xáo trộn vị trí bài học"
                            >
                                <i className="fa-solid fa-shuffle text-cyan-400"></i> Xáo Trộn
                            </button>
                        </div>
                    </div>

                    <div className="perspective-1000 w-full min-h-[360px] md:min-h-[400px]">
                        <div
                            onClick={() => {
                                setIsFlipped(!isFlipped);
                                if (!isFlipped && autoSpeech) {
                                    speakEnglish(currentCard.term);
                                }
                            }}
                            className={`relative w-full h-full min-h-[360px] md:min-h-[400px] transition-transform duration-500 transform-style-3d cursor-pointer ${isFlipped ? 'rotate-y-180' : ''}`}
                        >
                            {/* FRONT SIDE */}
                            <div className="absolute inset-0 w-full h-full backface-hidden glass-panel rounded-3xl p-8 flex flex-col justify-between border-2 border-slate-800 hover:border-cyan-500/40 transition-all shadow-2xl">

                                    <span className="text-xs font-mono tracking-widest text-cyan-400 uppercase bg-cyan-950/60 border border-cyan-800/60 px-3 py-1 rounded-full">
                                        Unit {currentCard.unit}: {currentCard.unitTitle}
                                    </span>
                                    <button
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            toggleLearned(currentCard.id);
                                        }}
                                        className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all flex items-center gap-1.5 ${isLearned ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-slate-800 hover:bg-slate-700 text-slate-400'}`}
                                    >
                                        <i className={`fa-solid ${isLearned ? 'fa-check-circle' : 'fa-circle'}`}></i>
                                        {isLearned ? 'Đã Thuộc' : 'Đánh dấu thuộc'}
                                    </button>
                                </div>

                                <div className="text-center my-auto space-y-4">
                                    <h2 className="text-3xl md:text-5xl font-extrabold text-white tracking-wide">
                                        {currentCard.term}
                                    </h2>
                                    <div className="flex items-center justify-center gap-3">
                                        <span className="text-slate-400 font-mono text-base">{currentCard.phonetic}</span>
                                        <button
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                speakEnglish(currentCard.term);
                                            }}
                                            className="w-9 h-9 rounded-full bg-cyan-500/20 hover:bg-cyan-500 text-cyan-400 hover:text-slate-950 flex items-center justify-center transition-all"
                                            title="Phát âm tiếng Anh"
                                        >
                                            <i className="fa-solid fa-volume-high text-sm"></i>
                                        </button>
                                    </div>
                                    <p className="text-xs text-slate-500 font-mono italic">({currentCard.type})</p>
                                </div>

                                <div className="text-center text-xs text-slate-400 flex items-center justify-center gap-2">
                                    <i className="fa-solid fa-hand-pointer text-cyan-400 animate-bounce"></i>
                                    <span>Chạm vào thẻ hoặc bấm [Phím Cách] để lật mở định nghĩa & nghĩa tiếng Việt</span>
                                </div>
                            </div>

                            {/* BACK SIDE */}
                            <div className="absolute inset-0 w-full h-full backface-hidden rotate-y-180 glass-panel rounded-3xl p-8 flex flex-col justify-between border-2 border-cyan-500/40 bg-slate-900/95 shadow-2xl overflow-y-auto">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <div className="flex items-center gap-2">
                                        <span className="text-lg font-bold text-cyan-400">{currentCard.term}</span>
                                        <span className="text-xs text-slate-400">({currentCard.type})</span>
                                    </div>
                                    <span className="text-xs font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-3 py-1 rounded-full">
                                        {currentCard.vietnamese}
                                    </span>
                                </div>

                                <div className="my-auto space-y-4 py-2">
                                    <div>
                                        <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Định Nghĩa Tiếng Anh:</h4>
                                        <p className="text-sm text-slate-200 leading-relaxed font-sans">{currentCard.definition}</p>
                                    </div>

                                    <div>
                                        <h4 className="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-1">Giải Thích Tiếng Việt:</h4>
                                        <p className="text-sm text-slate-300 leading-relaxed">{currentCard.explanation}</p>
                                    </div>

                                    <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                                        <h4 className="text-xs font-bold text-amber-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                                            <i className="fa-solid fa-quote-left"></i> Câu Ví Dụ Ngữ Cảnh:
                                        </h4>
                                        <p className="text-xs text-slate-300 italic">"{currentCard.example}"</p>
                                    </div>

                                    {currentCard.notes && (
                                        <div className="text-xs text-slate-400 bg-cyan-950/30 p-2.5 rounded-lg border border-cyan-900/50">
                                            <span className="font-semibold text-cyan-300">💡 Ghi chú kỹ thuật: </span>
                                            {currentCard.notes}
                                        </div>
                                    )}
                                </div>

                                <div className="text-center text-[11px] text-slate-500 pt-2 border-t border-slate-800/80">
                                    Lật thẻ lại để ôn từ mới
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Navigation Controls Bar */}
                    <div className="flex items-center justify-between gap-4">
                        <button
                            onClick={handlePrev}
                            className="px-5 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 text-sm font-semibold transition-all flex items-center gap-2 shadow-lg"
                        >
                            <i className="fa-solid fa-arrow-left"></i> Từ Trước [←]
                        </button>

                        <button
                            onClick={() => toggleLearned(currentCard.id)}
                            className={`px-6 py-3 rounded-xl text-sm font-bold transition-all flex items-center gap-2 shadow-lg ${isLearned ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700'}`}
                        >
                            <i className={`fa-solid ${isLearned ? 'fa-check' : 'fa-plus'}`}></i>
                            {isLearned ? 'Đã Học Thuộc' : 'Đánh Dấu Thuộc [M]'}
                        </button>

                        <button
                            onClick={handleNext}
                            className="px-5 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-sm font-bold transition-all flex items-center gap-2 shadow-lg shadow-cyan-500/20"
                        >
                            Từ Tiếp [→] <i className="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>

                    {/* Keyboard Shortcuts Legend */}
                    <div className="flex flex-wrap items-center justify-center gap-4 text-[11px] text-slate-400 pt-2">
                        <span><kbd className="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono">Space</kbd> Lật Thẻ</span>
                        <span><kbd className="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono">←/→</kbd> Chuyển Từ</span>
                        <span><kbd className="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono">S</kbd> Đọc Phát Âm</span>
                        <span><kbd className="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono">M</kbd> Thuộc / Chưa Thuộc</span>
                    </div>
                </div>
            );
        }

        function QuizModule({ vocabulary, recordQuizScore }) {
            const [quizMode, setQuizMode] = React.useState('mcq'); // 'mcq', 'matching', 'fill'
            const [questions, setQuestions] = React.useState([]);
            const [currentQIndex, setCurrentQIndex] = React.useState(0);
            const [selectedAnswer, setSelectedAnswer] = React.useState(null);
            const [isSubmitted, setIsSubmitted] = React.useState(false);
            const [score, setScore] = React.useState(0);
            const [quizFinished, setQuizFinished] = React.useState(false);

            // Generate quiz items based on current vocabulary list
            const generateQuiz = React.useCallback(() => {
                if (!vocabulary || vocabulary.length < 3) return;

                const shuffledVocab = [...vocabulary].sort(() => 0.5 - Math.random());
                const selectedItems = shuffledVocab.slice(0, Math.min(10, shuffledVocab.length));

                const generatedQs = selectedItems.map((item) => {
                    // Pick 3 random distractor definitions/translations
                    const otherItems = VOCABULARY_DATA.filter(v => v.id !== item.id);
                    const distractors = [...otherItems].sort(() => 0.5 - Math.random()).slice(0, 3);

                    if (quizMode === 'mcq') {
                        const options = [
                            { text: `${item.vietnamese} (${item.definition})`, isCorrect: true },
                            ...distractors.map(d => ({ text: `${d.vietnamese} (${d.definition})`, isCorrect: false }))
                        ].sort(() => 0.5 - Math.random());

                        return {
                            id: item.id,
                            term: item.term,
                            phonetic: item.phonetic,
                            book: item.book,
                            unit: item.unit,
                            options,
                            correctExplanation: `${item.term}: ${item.vietnamese} - ${item.explanation}`
                        };
                    } else if (quizMode === 'fill') {
                        // Replace term in example sentence with blank
                        const sentenceWithBlank = item.example.replace(new RegExp(item.term, 'gi'), '__________');
                        const options = [
                            { text: item.term, isCorrect: true },
                            ...distractors.map(d => ({ text: d.term, isCorrect: false }))
                        ].sort(() => 0.5 - Math.random());

                        return {
                            id: item.id,
                            prompt: sentenceWithBlank,
                            vietnameseHint: item.vietnamese,
                            options,
                            correctExplanation: item.example
                        };
                    }
                });

                setQuestions(generatedQs);
                setCurrentQIndex(0);
                setSelectedAnswer(null);
                setIsSubmitted(false);
                setScore(0);
                setQuizFinished(false);
            }, [vocabulary, quizMode]);

            React.useEffect(() => {
                generateQuiz();
            }, [generateQuiz]);

            if (!vocabulary || vocabulary.length < 3) {
                return (
                    <div className="glass-panel rounded-2xl p-12 text-center text-slate-400 space-y-3">
                        <i className="fa-solid fa-triangle-exclamation text-4xl text-amber-500"></i>
                        <p className="text-base font-medium">Cần ít nhất 3 thuật ngữ để tạo bài trắc nghiệm.</p>
                        <p className="text-xs text-slate-500">Hãy chọn lại bộ lọc sách hoặc Unit rộng hơn ở danh mục bên trái.</p>
                    </div>
                );
            }

            if (quizFinished) {
                const percentage = Math.round((score / questions.length) * 100);
                
                // Trigger confetti on good score
                if (percentage >= 80 && window.confetti) {
                    window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }

                return (
                    <div className="glass-panel rounded-3xl p-8 text-center space-y-6 max-w-xl mx-auto border border-cyan-500/30">
                        <div className="w-20 h-20 rounded-full bg-cyan-500/20 text-cyan-400 mx-auto flex items-center justify-center text-3xl shadow-lg">
                            <i className="fa-solid fa-award"></i>
                        </div>

                        <div>
                            <h2 className="text-2xl font-bold text-white">Hoàn Thành Bài Trắc Nghiệm!</h2>
                            <p className="text-xs text-slate-400 mt-1">Kết quả kiểm tra từ vựng chuyên ngành Computer Engineering</p>
                        </div>

                        <div className="bg-slate-900/80 p-6 rounded-2xl border border-slate-800 space-y-3">
                            <div className="text-4xl font-extrabold text-cyan-400">{score} / {questions.length}</div>
                            <div className="text-sm font-semibold text-slate-300">Tỷ lệ chính xác: {percentage}%</div>
                            <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
                                <div 
                                    className={`h-full transition-all duration-1000 ${percentage >= 80 ? 'bg-emerald-500' : percentage >= 50 ? 'bg-amber-500' : 'bg-rose-500'}`}
                                    style={{ width: `${percentage}%` }}
                                ></div>
                            </div>
                        </div>

                        <div className="flex gap-4">
                            <button
                                onClick={generateQuiz}
                                className="flex-1 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold transition-all text-sm shadow-lg shadow-cyan-500/20"
                            >
                                <i className="fa-solid fa-rotate-right mr-2"></i> Luyện Tập Lại
                            </button>
                        </div>
                    </div>
                );
            }

            const currentQ = questions[currentQIndex];
            if (!currentQ) return null;

            const handleSelectOption = (idx) => {
                if (isSubmitted) return;
                setSelectedAnswer(idx);
            };

            const handleSubmitAnswer = () => {
                if (selectedAnswer === null) return;
                setIsSubmitted(true);
                if (currentQ.options[selectedAnswer].isCorrect) {
                    setScore(s => s + 1);
                }
            };

            const handleNextQuestion = () => {
                if (currentQIndex + 1 < questions.length) {
                    setCurrentQIndex(i => i + 1);
                    setSelectedAnswer(null);
                    setIsSubmitted(false);
                } else {
                    setQuizFinished(true);
                    recordQuizScore(Math.round(((score + (currentQ.options[selectedAnswer].isCorrect ? 1 : 0)) / questions.length) * 100));
                }
            };

            return (
                <div className="space-y-6">
                    {/* Top Mode Selection */}
                    <div className="flex items-center justify-between bg-slate-900/60 p-3 rounded-xl border border-slate-800 text-xs">
                        <div className="flex items-center gap-2">
                            <span className="text-slate-400 font-medium">Chế độ kiểm tra:</span>
                            <button
                                onClick={() => setQuizMode('mcq')}
                                className={`px-3 py-1.5 rounded-lg transition-all ${quizMode === 'mcq' ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'}`}
                            >
                                Chọn Định Nghĩa
                            </button>
                            <button
                                onClick={() => setQuizMode('fill')}
                                className={`px-3 py-1.5 rounded-lg transition-all ${quizMode === 'fill' ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'}`}
                            >
                                Điền Khuyết Ngữ Cảnh
                            </button>
                        </div>

                        <div className="font-mono text-cyan-400 font-bold">
                            Câu {currentQIndex + 1} / {questions.length}
                        </div>
                    </div>

                    {/* Question Panel */}
                    <div className="glass-panel rounded-3xl p-6 md:p-8 space-y-6 border border-slate-800">
                        {quizMode === 'mcq' ? (
                            <div className="space-y-2">
                                <span className="text-xs font-mono text-cyan-400 uppercase tracking-widest bg-cyan-950/60 border border-cyan-800/60 px-3 py-1 rounded-full">
                                    Book {currentQ.book} - Unit {currentQ.unit}
                                </span>
                                <h3 className="text-2xl md:text-3xl font-extrabold text-white flex items-center gap-3 pt-2">
                                    {currentQ.term}
                                    <button
                                        onClick={() => speakEnglish(currentQ.term)}
                                        className="text-cyan-400 hover:text-cyan-300 text-base"
                                    >
                                        <i className="fa-solid fa-volume-high"></i>
                                    </button>
                                </h3>
                                <p className="text-xs text-slate-400 font-mono">{currentQ.phonetic}</p>
                                <p className="text-sm text-slate-300 pt-2">Chọn giải nghĩa chuẩn xác nhất cho thuật ngữ trên:</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                <span className="text-xs font-mono text-amber-400 uppercase tracking-widest bg-amber-950/60 border border-amber-800/60 px-3 py-1 rounded-full">
                                    Gợi ý tiếng Việt: {currentQ.vietnameseHint}
                                </span>
                                <p className="text-lg text-slate-100 font-serif leading-relaxed italic bg-slate-950/80 p-4 rounded-xl border border-slate-800">
                                    "{currentQ.prompt}"
                                </p>
                                <p className="text-sm text-slate-300">Chọn thuật ngữ tiếng Anh chính xác điền vào khoảng trống:</p>
                            </div>
                        )}

                        {/* Options Grid */}
                        <div className="grid grid-cols-1 gap-3">
                            {currentQ.options.map((opt, idx) => {
                                let btnStyle = "bg-slate-900/80 hover:bg-slate-800 border-slate-800 text-slate-200";
                                if (selectedAnswer === idx) {
                                    btnStyle = "bg-cyan-950/80 border-cyan-500 text-cyan-200 font-semibold";
                                }
                                if (isSubmitted) {
                                    if (opt.isCorrect) {
                                        btnStyle = "bg-emerald-950/90 border-emerald-500 text-emerald-200 font-bold shadow-lg shadow-emerald-950/50";
                                    } else if (selectedAnswer === idx) {
                                        btnStyle = "bg-rose-950/90 border-rose-500 text-rose-200 font-bold";
                                    }
                                }

                                return (
                                    <button
                                        key={idx}
                                        onClick={() => handleSelectOption(idx)}
                                        disabled={isSubmitted}
                                        className={`w-full p-4 rounded-2xl border text-left text-sm transition-all flex items-start gap-3 ${btnStyle}`}
                                    >
                                        <span className="w-6 h-6 rounded-full bg-slate-800 flex items-center justify-center text-xs font-mono font-bold shrink-0 mt-0.5">
                                            {String.fromCharCode(65 + idx)}
                                        </span>
                                        <span className="leading-relaxed">{opt.text}</span>
                                    </button>
                                );
                            })}
                        </div>

                        {/* Feedback & Actions */}
                        {isSubmitted && (
                            <div className={`p-4 rounded-2xl border text-xs leading-relaxed space-y-1 ${currentQ.options[selectedAnswer].isCorrect ? 'bg-emerald-950/40 border-emerald-800/80 text-emerald-300' : 'bg-rose-950/40 border-rose-800/80 text-rose-300'}`}>
                                <div className="font-bold text-sm flex items-center gap-2">
                                    <i className={`fa-solid ${currentQ.options[selectedAnswer].isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'}`}></i>
                                    {currentQ.options[selectedAnswer].isCorrect ? 'Chính Xác!' : 'Chưa Chính Xác!'}
                                </div>
                                <div><span className="font-semibold">Giải thích: </span>{currentQ.correctExplanation}</div>
                            </div>
                        )}

                        <div className="flex justify-end pt-2">
                            {!isSubmitted ? (
                                <button
                                    onClick={handleSubmitAnswer}
                                    disabled={selectedAnswer === null}
                                    className={`px-6 py-3 rounded-xl font-bold text-sm transition-all ${selectedAnswer !== null ? 'bg-cyan-500 hover:bg-cyan-400 text-slate-950 shadow-lg shadow-cyan-500/20' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}
                                >
                                    Xác Nhận Đáp Án
                                </button>
                            ) : (
                                <button
                                    onClick={handleNextQuestion}
                                    className="px-6 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-cyan-500/20 flex items-center gap-2"
                                >
                                    {currentQIndex + 1 < questions.length ? 'Câu Tiếp Theo' : 'Xem Kết Quả'} <i className="fa-solid fa-arrow-right"></i>
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function ReadingModule({ selectedBook, selectedUnit }) {
            const [activeUnit, setActiveUnit] = React.useState(selectedUnit === 'all' ? 1 : selectedUnit);
            const [activeBook, setActiveBook] = React.useState(selectedBook === 'all' ? 1 : selectedBook);

            // Sync with parent filter
            React.useEffect(() => {
                if (selectedBook !== 'all') setActiveBook(selectedBook);
                if (selectedUnit !== 'all') setActiveUnit(selectedUnit);
            }, [selectedBook, selectedUnit]);

            const currentVocabList = VOCABULARY_DATA.filter(v => v.book === activeBook && v.unit === activeUnit);
            const unitTitle = currentVocabList.length > 0 ? currentVocabList[0].unitTitle : `Unit ${activeUnit}`;

            // Simulated Reading Passages per book
            const readingPassages = {
                1: "Modern computer systems consist of integrated hardware components working seamlessly together. At the heart of every PC is the motherboard, which houses the Central Processing Unit (CPU) and System RAM. Operating systems manage process execution through kernel routines and present user interfaces such as GUIs. Data persistence is guaranteed through non-volatile devices like Solid State Drives (SSDs). Engineers also analyze low-level binary math using Boolean Algebra and adhere to electrical fundamentals governed by Ohm's Law.",
                2: "Intermediate computer architecture focuses on circuit execution efficiency and signal dynamics. Instruments like the oscilloscope allow engineers to trace propagation delay across high-speed PCB traces. Inside the CPU, the Arithmetic Logic Unit (ALU) performs bitwise shifting and two's complement arithmetic operations. Reduced Instruction Set Computers (RISC) optimize execution by implementing single-cycle instructions, while components like multiplexers (MUX) handle dynamic signal routing.",
                3: "Advanced computer engineering addresses performance scaling through hardware parallelism and memory hierarchies. Modern microprocessors employ instruction pipelining, out-of-order execution (OoOE), and multi-level cache hierarchies (L1, L2, L3). Translation Lookaside Buffers (TLB) accelerate virtual memory address conversion, while high-bandwidth interconnects like PCIe and NVMe maximize data throughput across System-on-Chip (SoC) architectures."
            };

            return (
                <div className="space-y-6">
                    {/* Unit Selector Header */}
                    <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                        <div>
                            <span className="text-xs font-mono text-cyan-400 uppercase tracking-widest">
                                Book {activeBook} - Unit {activeUnit}
                            </span>
                            <h2 className="text-xl font-bold text-white">{unitTitle}</h2>
                        </div>

                        <button
                            onClick={() => speakEnglish(readingPassages[activeBook])}
                            className="px-4 py-2 rounded-xl bg-cyan-500/20 hover:bg-cyan-500 text-cyan-300 hover:text-slate-950 font-bold text-xs transition-all flex items-center gap-2 border border-cyan-500/40"
                        >
                            <i className="fa-solid fa-volume-high"></i> Nghe Đọc Bài Text (Audio)
                        </button>
                    </div>

                    {/* Textbook Passage Card */}
                    <div className="glass-panel rounded-3xl p-6 md:p-8 space-y-4 border border-slate-800">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                            <i className="fa-solid fa-file-lines text-cyan-400"></i> Bài Đọc Mẫu Ngữ Cảnh Chuyên Ngành (Core Reading Text)
                        </h3>
                        <p className="text-base text-slate-200 font-serif leading-relaxed bg-slate-950/60 p-6 rounded-2xl border border-slate-800/80">
                            {readingPassages[activeBook]}
                        </p>
                    </div>

                    {/* Vocabulary Highlights Table */}
                    <div className="glass-panel rounded-3xl p-6 border border-slate-800 space-y-4">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                            <i className="fa-solid fa-table-list text-cyan-400"></i> Thuật Ngữ Trọng Tâm Trong Bài Học ({currentVocabList.length})
                        </h3>

                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs text-slate-300 border-collapse">
                                <thead>
                                    <tr className="border-b border-slate-800 text-slate-400 uppercase font-mono bg-slate-900/50">
                                        <th className="p-3">Thuật Ngữ (Term)</th>
                                        <th className="p-3">Phiên Âm</th>
                                        <th className="p-3">Tiếng Việt</th>
                                        <th className="p-3">Định Nghĩa Tiếng Anh</th>
                                        <th className="p-3 text-center">Âm Thanh</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {currentVocabList.map(v => (
                                        <tr key={v.id} className="border-b border-slate-800/60 hover:bg-slate-800/40 transition-all">
                                            <td className="p-3 font-bold text-cyan-300">{v.term}</td>
                                            <td className="p-3 font-mono text-slate-400">{v.phonetic}</td>
                                            <td className="p-3 font-semibold text-emerald-400">{v.vietnamese}</td>
                                            <td className="p-3 text-slate-300 max-w-xs">{v.definition}</td>
                                            <td className="p-3 text-center">
                                                <button
                                                    onClick={() => speakEnglish(v.term)}
                                                    className="w-7 h-7 rounded-full bg-slate-800 hover:bg-cyan-500 text-slate-300 hover:text-slate-950 flex items-center justify-center transition-all mx-auto"

                                                    <i className="fa-solid fa-volume-high text-xs"></i>

        function GlossaryModule({ learnedIds, toggleLearned }) {
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterBook, setFilterBook] = React.useState('all');
            const [selectedTermDetail, setSelectedTermDetail] = React.useState(null);

            const filteredList = React.useMemo(() => {
                return VOCABULARY_DATA.filter(item => {
                    const matchesSearch = item.term.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                          item.vietnamese.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                          item.definition.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesBook = filterBook === 'all' || item.book === Number(filterBook);
                    return matchesSearch && matchesBook;
                });
            }, [searchTerm, filterBook]);

            return (
                <div className="space-y-6">
                    {/* Search & Filter Controls */}
                    <div className="flex flex-col md:flex-row items-center justify-between gap-4 bg-slate-900/60 p-4 rounded-2xl border border-slate-800">
                        <div className="relative w-full md:w-96">
                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                            <input
                                type="text"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                placeholder="Tìm kiếm thuật ngữ (ví dụ: ALU, MOSFET, Cache...)"
                                className="w-full pl-10 pr-4 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 transition-all"
                            />
                        </div>

                        <div className="flex items-center gap-3 w-full md:w-auto">
                            <select
                                value={filterBook}
                                onChange={(e) => setFilterBook(e.target.value)}
                                className="bg-slate-950 border border-slate-800 text-xs text-slate-300 rounded-xl px-3 py-2 focus:outline-none focus:border-cyan-500"
                            >
                                <option value="all">Tất cả Sách (Book 1, 2, 3)</option>
                                <option value="1">Book 1: Basics</option>
                                <option value="2">Book 2: Intermediate</option>
                                <option value="3">Book 3: Advanced</option>
                            </select>

                            <span className="text-xs text-slate-400 font-mono">
                                Kết quả: <strong className="text-cyan-400">{filteredList.length}</strong> từ
                            </span>
                        </div>
                    </div>

                    {/* Term Cards Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {filteredList.map(item => {
                            const isLearned = learnedIds.includes(item.id);
                            return (
                                <div
                                    key={item.id}
                                    onClick={() => setSelectedTermDetail(item)}
                                    className="glass-panel p-5 rounded-2xl border border-slate-800 hover:border-cyan-500/50 transition-all cursor-pointer space-y-3 group"
                                >
                                    <div className="flex items-start justify-between gap-2">
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <h3 className="text-base font-bold text-white group-hover:text-cyan-300 transition-colors">
                                                    {item.term}
                                                </h3>
                                                <span className="text-[10px] font-mono text-slate-400">({item.type})</span>
                                            </div>
                                            <p className="text-xs font-mono text-slate-400">{item.phonetic}</p>
                                        </div>

                                        <button
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                toggleLearned(item.id);
                                            }}
                                            className={`p-2 rounded-lg text-xs transition-all ${isLearned ? 'text-emerald-400 bg-emerald-950/40' : 'text-slate-500 hover:text-slate-300 bg-slate-900'}`}
                                            title={isLearned ? 'Đã thuộc' : 'Đánh dấu thuộc'}
                                        >
                                            <i className={`fa-solid ${isLearned ? 'fa-circle-check' : 'fa-circle'}`}></i>
                                        </button>
                                    </div>

                                    <div className="text-xs text-emerald-400 font-semibold">
                                        {item.vietnamese}
                                    </div>

                                    <p className="text-xs text-slate-300 line-clamp-2 leading-relaxed">
                                        {item.definition}
                                    </p>

                                    <div className="flex items-center justify-between text-[10px] text-slate-400 pt-2 border-t border-slate-800/80">
                                        <span className="bg-slate-900 px-2 py-0.5 rounded">Book {item.book} - Unit {item.unit}</span>
                                        <span className="text-cyan-400 flex items-center gap-1">Chi tiết <i className="fa-solid fa-chevron-right text-[8px]"></i></span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Detailed Term Modal */}
                    {selectedTermDetail && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                            <div className="glass-panel max-w-lg w-full rounded-3xl p-6 border border-cyan-500/40 space-y-4 shadow-2xl relative">
                                <button
                                    onClick={() => setSelectedTermDetail(null)}
                                    className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-all"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                <div className="space-y-1">
                                    <span className="text-[10px] font-mono text-cyan-400 bg-cyan-950 border border-cyan-800 px-2.5 py-0.5 rounded-full uppercase">
                                        Book {selectedTermDetail.book} • Unit {selectedTermDetail.unit}
                                    </span>
                                    <h2 className="text-2xl font-extrabold text-white pt-1">{selectedTermDetail.term}</h2>
                                    <p className="text-xs font-mono text-slate-400">{selectedTermDetail.phonetic}</p>
                                </div>

                                <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-1">
                                    <div className="text-xs font-bold text-slate-400">Nghĩa Tiếng Việt:</div>
                                    <div className="text-sm font-bold text-emerald-400">{selectedTermDetail.vietnamese}</div>
                                </div>

                                <div className="space-y-2 text-xs text-slate-300">
                                    <div>
                                        <span className="font-bold text-slate-400">Định nghĩa Tiếng Anh:</span>
                                        <p className="mt-1 leading-relaxed">{selectedTermDetail.definition}</p>
                                    </div>
                                    <div>
                                        <span className="font-bold text-slate-400">Giải thích chi tiết:</span>
                                        <p className="mt-1 leading-relaxed text-slate-300">{selectedTermDetail.explanation}</p>
                                    </div>
                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 italic">
                                        "{selectedTermDetail.example}"
                                    </div>
                                </div>

                                <div className="flex gap-3 pt-2">
                                    <button
                                        onClick={() => speakEnglish(selectedTermDetail.term)}
                                        className="flex-1 py-2.5 rounded-xl bg-cyan-500/20 hover:bg-cyan-500 text-cyan-300 hover:text-slate-950 font-bold text-xs transition-all flex items-center justify-center gap-2 border border-cyan-500/40"
                                    >
                                        <i className="fa-solid fa-volume-high"></i> Đọc Phát Âm
                                    </button>
                                    <button
                                        onClick={() => {
                                            toggleLearned(selectedTermDetail.id);
                                            setSelectedTermDetail(null);
                                        }}
                                        className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs transition-all"
                                    >
                                        {learnedIds.includes(selectedTermDetail.id) ? 'Bỏ Đánh Dấu' : 'Đánh Dấu Đã Thuộc'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ProgressModule({ stats, learnedIds, resetProgress }) {
            const totalVocab = VOCABULARY_DATA.length;
            const completionRate = Math.round((learnedIds.length / totalVocab) * 100);

            // Per book mastery
            const b1Learned = VOCABULARY_DATA.filter(v => v.book === 1 && learnedIds.includes(v.id)).length;
            const b1Total = VOCABULARY_DATA.filter(v => v.book === 1).length;

            const b2Learned = VOCABULARY_DATA.filter(v => v.book === 2 && learnedIds.includes(v.id)).length;
            const b2Total = VOCABULARY_DATA.filter(v => v.book === 2).length;

            const b3Learned = VOCABULARY_DATA.filter(v => v.book === 3 && learnedIds.includes(v.id)).length;
            const b3Total = VOCABULARY_DATA.filter(v => v.book === 3).length;

            return (
                <div className="space-y-6">
                    {/* Mastery Overview Header */}
                    <div className="glass-panel rounded-3xl p-6 md:p-8 border border-slate-800 space-y-6">
                        <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                            <div>
                                <h2 className="text-2xl font-extrabold text-white">Tổng Quan Tiến Độ Học Tập</h2>
                                <p className="text-xs text-slate-400 mt-1">Dữ liệu được lưu trữ tự động trên thiết bị của bạn</p>
                            </div>

                            <div className="text-center md:text-right">
                                <div className="text-4xl font-black text-cyan-400">{completionRate}%</div>
                                <div className="text-xs text-slate-400">Hoàn thành toàn bộ sách</div>
                            </div>
                        </div>

                        {/* Global Bar */}
                        <div className="w-full bg-slate-900 rounded-full h-4 overflow-hidden p-0.5 border border-slate-800">
                            <div
                                className="bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-500 h-full rounded-full transition-all duration-1000"
                                style={{ width: `${completionRate}%` }}
                            ></div>
                        </div>
                    </div>

                    {/* Book Breakdown Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {[
                            { name: 'Book 1: Basics', learned: b1Learned, total: b1Total, color: 'from-blue-500 to-cyan-500' },
                            { name: 'Book 2: Intermediate', learned: b2Learned, total: b2Total, color: 'from-purple-500 to-indigo-500' },
                            { name: 'Book 3: Advanced', learned: b3Learned, total: b3Total, color: 'from-emerald-500 to-teal-500' }
                        ].map((b, idx) => {
                            const pct = Math.round((b.learned / b.total) * 100) || 0;
                            return (
                                <div key={idx} className="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3">
                                    <div className="flex items-center justify-between text-xs font-bold text-slate-200">
                                        <span>{b.name}</span>
                                        <span className="text-cyan-400">{pct}%</span>
                                    </div>

                                    <div className="w-full bg-slate-900 rounded-full h-2.5 overflow-hidden">
                                        <div
                                            className={`bg-gradient-to-r ${b.color} h-full transition-all duration-700`}
                                            style={{ width: `${pct}%` }}
                                        ></div>
                                    </div>

                                    <div className="text-[11px] text-slate-400 flex justify-between">
                                        <span>Đã thuộc:</span>
                                        <span className="font-bold text-slate-200">{b.learned} / {b.total} từ</span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Danger Zone / Reset */}
                    <div className="glass-panel rounded-2xl p-4 border border-rose-900/30 bg-rose-950/10 flex items-center justify-between text-xs">
                        <div className="text-slate-400">
                            <span className="font-semibold text-rose-400">Đặt lại tiến độ: </span>
                            Xóa toàn bộ từ vựng đã thuộc và điểm kiểm tra để học lại từ đầu.
                        </div>
                        <button
                            onClick={resetProgress}
                            className="px-4 py-2 rounded-xl bg-rose-900/40 hover:bg-rose-800 text-rose-200 font-bold transition-all border border-rose-700/50"
                        >
                            Reset Tiến Độ
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            const [currentTab, setCurrentTab] = React.useState('flashcard');
            const [selectedBook, setSelectedBook] = React.useState('all');
            const [selectedUnit, setSelectedUnit] = React.useState('all');

            // Persistent LocalStorage State
            const [learnedIds, setLearnedIds] = React.useLocalStorage ? React.useLocalStorage('ce_learned_ids', []) : React.useState(() => {
                try {
                    const item = window.localStorage.getItem('ce_learned_ids');
                    return item ? JSON.parse(item) : [];
                } catch {
                    return [];
                }
            });

            const [highScore, setHighScore] = React.useState(() => {
                try {
                    return Number(window.localStorage.getItem('ce_high_score')) || 0;
                } catch {
                    return 0;
                }
            });

            const [streak, setStreak] = React.useState(() => {
                try {
                    return Number(window.localStorage.getItem('ce_streak_count')) || 1;
                } catch {
                    return 1;
                }
            });

            // Save learned IDs
            React.useEffect(() => {
                try {
                    window.localStorage.setItem('ce_learned_ids', JSON.stringify(learnedIds));
                } catch (e) {
                    console.error(e);
                }
            }, [learnedIds]);

            const toggleLearned = (id) => {
                setLearnedIds(prev => 
                    prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
                );
            };

            const recordQuizScore = (scorePct) => {
                if (scorePct > highScore) {
                    setHighScore(scorePct);
                    try {
                        window.localStorage.setItem('ce_high_score', scorePct.toString());
                    } catch (e) {
                        console.error(e);
                    }
                }
            };

            const resetProgress = () => {
                if (window.confirm ? window.confirm('Bạn có chắc chắn muốn đặt lại tất cả tiến độ học?') : true) {
                    setLearnedIds([]);
                    setHighScore(0);
                    window.localStorage.removeItem('ce_learned_ids');
                    window.localStorage.removeItem('ce_high_score');
                }
            };

            // Filter vocabulary data according to sidebar selections
            const filteredVocabulary = React.useMemo(() => {
                return VOCABULARY_DATA.filter(item => {
                    const matchesBook = selectedBook === 'all' || item.book === selectedBook;
                    const matchesUnit = selectedUnit === 'all' || item.unit === selectedUnit;
                    return matchesBook && matchesUnit;
                });
            }, [selectedBook, selectedUnit]);

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        <Header 
                            currentTab={currentTab} 
                            setCurrentTab={setCurrentTab} 
                            stats={{ streak, learnedCount: learnedIds.length, highScore }}
                            resetProgress={resetProgress}
                        />

                        <main className="max-w-7xl mx-auto px-4 lg:px-8 py-6">
                            <div className="flex flex-col lg:flex-row gap-6">
                                <SidebarFilter 
                                    selectedBook={selectedBook} 
                                    setSelectedBook={setSelectedBook}
                                    selectedUnit={selectedUnit}
                                    setSelectedUnit={setSelectedUnit}
                                    learnedIds={learnedIds}
                                />

                                <section className="flex-1 min-w-0">
                                    {currentTab === 'flashcard' && (
                                        <FlashcardsModule 
                                            vocabulary={filteredVocabulary} 
                                            learnedIds={learnedIds} 
                                            toggleLearned={toggleLearned}
                                        />
                                    )}

                                    {currentTab === 'quiz' && (
                                        <QuizModule 
                                            vocabulary={filteredVocabulary}
                                            recordQuizScore={recordQuizScore}
                                        />
                                    )}

                                    {currentTab === 'reader' && (
                                        <ReadingModule 
                                            selectedBook={selectedBook}
                                            selectedUnit={selectedUnit}
                                        />
                                    )}

                                    {currentTab === 'glossary' && (
                                        <GlossaryModule 
                                            learnedIds={learnedIds}
                                            toggleLearned={toggleLearned}
                                        />
                                    )}

                                    {currentTab === 'progress' && (
                                        <ProgressModule 
                                            stats={{ streak, learnedCount: learnedIds.length, highScore }}
                                            learnedIds={learnedIds}
                                            resetProgress={resetProgress}
                                        />
                                    )}
                                </section>
                            </div>
                        </main>
                    </div>

                    <footer className="glass-panel border-t border-slate-800 text-center py-4 text-xs text-slate-500">
                        Career Paths: Computer Engineering Study Hub • Thiết kế cho Sinh viên & Kỹ sư Khoa học Máy tính
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
